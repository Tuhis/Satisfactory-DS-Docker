name: Update check

on:
    workflow_dispatch:
        inputs:
            force:
                description: 'Rebuild and push the image even if the Steam build has not changed (e.g. after a Dockerfile change). Overwrites the existing build ID tag.'
                type: boolean
                default: false
    schedule:
        - cron: '0 * * * *'

jobs:
    update:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3.1.0
              with:
                  fetch-depth: 0
            - name: Use Node.js 16.x
              uses: actions/setup-node@v3
              with:
                  node-version: 16
            - name: Install system dependencies
              run: sudo apt-get update && sudo apt-get install -y git curl jq
            - name: 'Get Previous tag'
              id: previoustag
              uses: 'WyriHaximus/github-action-get-previous-tag@v1'
              with:
                  fallback: 0000000
            - name: 'Run the update script'
              id: update
              env:
                  PREVIOUS_TAG: '${{ steps.previoustag.outputs.tag }}'
                  DOCKER_TOKEN: ${{secrets.DOCKER_TOKEN}}
                  GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
                  # 'true' only for a manual run with "force" ticked; empty on schedule
                  FORCE_UPDATE: ${{ inputs.force && 'true' || '' }}
              run: |
                  npm install
                  node ./ci/update.mjs
